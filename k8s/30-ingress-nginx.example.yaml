#python-hls-streaming\k8s\30-ingress-nginx.example.yaml
# Example only for ingress-nginx. Replace host, TLS Secret and ingress class.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hls-api
  namespace: hls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hls.example.com
      secretName: hls-api-tls
  rules:
    - host: hls.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hls-api
                port:
                  number: 8000
