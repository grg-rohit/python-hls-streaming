#python-hls-streaming\k8s\01-service-accounts.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hls-api
  namespace: hls
  # Associate with a cloud IAM identity/role when using workload identity.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hls-worker
  namespace: hls
automountServiceAccountToken: true
