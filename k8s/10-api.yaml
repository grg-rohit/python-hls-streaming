#python-hls-streaming\k8s\10-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hls-api
  namespace: hls
  labels:
    app.kubernetes.io/name: hls-api
spec:
  replicas: 1
  # The current S3 JSON repository uses an in-process lock. Keep one API replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hls-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hls-api
    spec:
      serviceAccountName: hls-api
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/grg-rohit/python-hls-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # The API gets the complete .env, including S3 settings and optional
          # browser Basic Auth credentials. Values never go into a ConfigMap.
          envFrom:
            - secretRef:
                name: hls-env
          env:
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: upload-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 20Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 24Gi
      volumes:
        - name: upload-tmp
          emptyDir:
            sizeLimit: 22Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hls-api
  namespace: hls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hls-api
  ports:
    - name: http
      port: 8000
      targetPort: http
