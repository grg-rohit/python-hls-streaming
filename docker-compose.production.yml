services:
  server:
    environment:
      HYBRID_DEPLOYMENT: "true"
      AI_REQUIRED_DEVICE: cuda
      REQUIRE_APP_AUTH: "true"
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes: !reset []
  worker-cpu:
    environment:
      WORKER_CAPABILITIES: cpu

  nginx:
    image: nginx:stable-alpine
    command: ["/bin/sh", "-c", "sh /etc/nginx/hls/entrypoint.sh && exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/hls:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      server:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-conf:
