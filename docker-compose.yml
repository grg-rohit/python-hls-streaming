services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: app/.env
    ports:
      - "8000:8000"
    volumes:
      - ./public:/app/public:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        TORCH_VERSION: "2.14.1"
    image: hls-worker:cpu
    profiles: ["cpu-worker"]
    restart: unless-stopped
    env_file: app/.env
    environment:
      API_BASE_URL: http://server:8000
      WORKER_DEVICE: cpu
      AI_ENCODER: cpu
      AI_HALF: "false"
      WORKER_DATA_DIR: /app/worker_data
      FRAMELIFT_WEIGHTS: /app/worker_data/framelift_weights
    command: ["python", "worker.py"]
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./worker_data:/app/worker_data

  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
        TORCH_VERSION: "2.14.1"
    image: hls-worker:gpu
    profiles: ["gpu"]
    restart: unless-stopped
    env_file: app/.env
    environment:
      API_BASE_URL: http://server:8000
      WORKER_DEVICE: cuda
      AI_ENCODER: nvenc
      AI_HALF: "true"
      WORKER_DATA_DIR: /app/worker_data
      FRAMELIFT_WEIGHTS: /app/worker_data/framelift_weights
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    command: ["python", "worker.py"]
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./worker_data:/app/worker_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
