server {
    listen 80 default_server;
    server_name rohitgrg.com.np;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://rohitgrg.com.np$request_uri; }
}
server {
    listen 443 ssl;
    server_name rohitgrg.com.np;
    ssl_certificate /etc/letsencrypt/live/rohitgrg.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rohitgrg.com.np/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2g;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend server:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
